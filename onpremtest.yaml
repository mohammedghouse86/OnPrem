  /admin/host_topology/json:
    get:
      tags:
      - Admin
      summary: Host topology (JSON)
      description: 'Polled on a timer by the topology page. The capture shows the cache-buster sent as a dynamic
        query KEY with an empty value (?1700000000000=), not as a named parameter with a value. The _
        parameter below stands in for that key, which OpenAPI cannot express directly. This is the one
        path observed answering 200 without a trailing slash. Observed in the StarlingX HAR captures.'
      operationId: get_admin_host_topology_json
      parameters:
      - $ref: '#/components/parameters/CookieHeader'
      - $ref: '#/components/parameters/CsrfTokenHeader'
      - $ref: '#/components/parameters/RequestedWithHeader'
      - name: _
        in: query
        required: false
        description: 'Cache-buster. In the capture the key itself is an epoch-ms timestamp and the value is empty.'
        schema:
          type: string
        example: 1700000000000
      responses:
        '200':
          description: 'Topology payload. Served as text/json.'
          content:
            text/json:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
