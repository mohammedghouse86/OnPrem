openapi: 3.0.3
info:
  title: OnPrem Test API
  description: 'OpenAPI spec MoonSun. Surface reconstructed from two StarlingX/Horizon
    dashboard HAR captures (1059 requests, 32 distinct paths) merged with the endpoints
    previously derived from probe/crawl logs. Paths use the trailing-slash form Django
    treats as canonical: the capture shows GET /admin/active_alarms answering 301 to
    /admin/active_alarms/. The one exception is /admin/host_topology/json, observed
    answering 200 without a trailing slash. Response bodies were not recorded in the
    captures, so only status codes and content types are documented.'
  version: 1.1.0
  x-observed-ids:
    orgId: 6a68df8e793f44109c3f2f6c
    appId: 6a832657fe79c4b93a3804f1
    exampleRunId: 6a88865d442ba0277bb14fdc
    note: Context identifiers captured.
  x-har-capture:
    files:
    - StarlingX HAR request 1.json
    - StarlingX HAR request 2.json
    origin: redacted - internal host
    entries: 1059
    distinctPaths: 32
    responseBodies: not recorded
servers:
- url: https://onprem-01yz.onrender.com
  description: Mock implementation of this surface.
- url: https://onprem.example.internal
  description: 'Placeholder for the internal StarlingX host the captures came from; the real hostname is not kept in this repo.'
security:
- platformSessionCookie: []
  csrfTokenHeader: []
  requestedWithHeader: []
paths:
  /:
    get:
      tags:
      - Other
      summary: Dashboard root
      description: 'Redirects to the default dashboard. Observed in the StarlingX HAR captures.'
      operationId: get_root
      parameters:
      - $ref: '#/components/parameters/CookieHeader'
      - $ref: '#/components/parameters/CsrfTokenHeader'
      - $ref: '#/components/parameters/RequestedWithHeader'
      responses:
        '302':
          description: 'Redirect to /admin/.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/login/:
    get:
      tags:
      - Authentication
      summary: Login page (CSRF bootstrap)
      description: 'Renders the login form and sets the CSRF cookie that POST /auth/login/ requires. Not recorded
        directly; inferred from the Referer on the captured login POSTs.'
      operationId: get_auth_login
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestedWithHeader'
      responses:
        '200':
          description: 'Login form rendered.'
          content:
            text/html:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Authentication
      summary: Log in
      description: 'Authenticates against the dashboard and establishes the session. Answers 302 to / on success.
        fake_email and fake_password are browser autofill decoys sent empty by the UI. Observed in the
        StarlingX HAR captures.'
      operationId: post_auth_login
      security: []
      parameters:
      - $ref: '#/components/parameters/CookieHeader'
      - $ref: '#/components/parameters/CsrfTokenHeader'
      - $ref: '#/components/parameters/RequestedWithHeader'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - csrfmiddlewaretoken
              - region
              - username
              - password
              properties:
                csrfmiddlewaretoken:
                  type: string
                region:
                  type: string
                username:
                  type: string
                password:
                  type: string
                fake_email:
                  type: string
                fake_password:
                  type: string
            example:
              csrfmiddlewaretoken: '<csrf-token>'
              region: default
              username: dashboard_admin
              password: '<password>'
              fake_email: ''
              fake_password: ''
      responses:
        '302':
          description: 'Authenticated. Location: /'
        '200':
          description: 'Login form redisplayed with errors when the credentials are rejected.'
          content:
            text/html:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/:
    get:
      tags:
      - Admin
      summary: Admin dashboard
      description: 'Landing page of the admin dashboard. Observed in the StarlingX HAR captures.'
      operationId: get_admin
      parameters:
      - $ref: '#/components/parameters/CookieHeader'
      - $ref: '#/components/parameters/CsrfTokenHeader'
      - $ref: '#/components/parameters/RequestedWithHeader'
      - name: tab
