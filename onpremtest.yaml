components:
  securitySchemes:
    platformSessionCookie:
      type: apiKey
      in: cookie
      name: platformsessionid
      description: 'Session cookie issued by POST /login. It travels in the Cookie header
        alongside platformcsrftoken, login_region and login_domain - see the Cookie parameter,
        which is required on every operation.'
    csrfTokenHeader:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: Must carry the same value as the platformcsrftoken cookie (double-submit).
    requestedWithHeader:
      type: apiKey
      in: header
      name: X-Requested-With
      description: Must be the literal string XMLHttpRequest.
  parameters:
    CookieHeader:
      name: Cookie
      in: header
      required: true
      description: 'All four platform cookies. platformsessionid and platformcsrftoken are
        mandatory; login_region and login_domain are set by the login flow and echoed back.'
      schema:
        type: string
      example: 'login_region=default; login_domain=""; platformcsrftoken=UZuMhVTfTR3qlMLpEJNCcWEJ1BylzO6vFsopW9gADP4A1TBFuNfHh9NYhDWpanQQ;
        platformsessionid=vf1253sf5c8iy7vrl3ubr07wrsjyb3l2'
    CsrfTokenHeader:
      name: X-CSRFToken
      in: header
      required: true
      description: Must equal the platformcsrftoken cookie. A missing or mismatched value is
        rejected with 403.
      schema:
        type: string
      example: UZuMhVTfTR3qlMLpEJNCcWEJ1BylzO6vFsopW9gADP4A1TBFuNfHh9NYhDWpanQQ
    RequestedWithHeader:
      name: X-Requested-With
      in: header
      required: true
      description: Must be the literal string XMLHttpRequest.
      schema:
        type: string
        enum:
        - XMLHttpRequest
      example: XMLHttpRequest
  schemas:
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        region:
          type: string
          description: Stored in the login_region cookie. Defaults to the cookie value, then
            to 'default'.
        domain:
          type: string
          description: Stored in the login_domain cookie.
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
  responses:
    Unauthorized:
      description: Cookie header, platformsessionid cookie, or session is missing or unknown.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CsrfFailure:
      description: X-CSRFToken is missing, or does not match the platformcsrftoken cookie.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MissingRequestedWith:
      description: X-Requested-With is missing or is not XMLHttpRequest.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'X-Requested-With is missing or wrong, X-CSRFToken is missing or does
        not match the platformcsrftoken cookie, or the role of the session is not permitted
        to reach this path.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
