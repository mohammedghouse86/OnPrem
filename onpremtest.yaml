components:
  securitySchemes:
    platformSessionCookie:
      type: apiKey
      in: cookie
      name: platformsessionid
      description: 'Session cookie established by POST /auth/login/. It travels in the Cookie
        header alongside platformcsrftoken, login_region and login_domain - see the Cookie
        parameter, which is required on every operation.'
    csrfTokenHeader:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: Must carry the same value as the platformcsrftoken cookie (double-submit).
    requestedWithHeader:
      type: apiKey
      in: header
      name: X-Requested-With
      description: Must be the literal string XMLHttpRequest.
  parameters:
    CookieHeader:
      name: Cookie
      in: header
      required: true
      description: 'All four platform cookies. platformsessionid and platformcsrftoken are
        mandatory; login_region and login_domain are set by the login flow and echoed back.
        Cookies were scrubbed from the HAR captures, so the names come from the platform
        auth contract rather than from the capture itself.'
      schema:
        type: string
    CsrfTokenHeader:
      name: X-CSRFToken
      in: header
      required: true
      description: 'Must equal the platformcsrftoken cookie. Present on 432 of the captured
        requests; a missing or mismatched value is rejected with 403.'
      schema:
        type: string
    RequestedWithHeader:
      name: X-Requested-With
      in: header
      required: true
      description: 'Must be the literal string XMLHttpRequest. Present on 544 of the captured
        requests - the XHR calls. Full-page browser navigations in the capture do not carry it,
        since a browser cannot add headers to a top-level document load.'
      schema:
        type: string
        enum:
        - XMLHttpRequest
      example: XMLHttpRequest
  schemas:
    PolicyRequest:
      type: object
      required:
      - rules
      properties:
        rules:
          type: array
          description: Each rule is a [service, action] pair.
          items:
            type: array
            items:
              type: string
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
  responses:
    Unauthorized:
      description: Cookie header, platformsessionid cookie, or session is missing or unknown.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'X-Requested-With is missing or wrong, X-CSRFToken is missing or does not
        match the platformcsrftoken cookie, or the role of the session is not permitted to
        reach this path.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
