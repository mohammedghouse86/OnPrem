  /login:
    get:
      tags:
      - Authentication
      summary: CSRF bootstrap
      description: 'Issues the platformcsrftoken, login_region and login_domain cookies. No
        session is required - this is the first call of the login flow, and its token is what
        POST /login expects to see echoed back in the X-CSRFToken header.'
      operationId: get_login
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestedWithHeader'
      - name: region
        in: query
        required: false
        description: Value stored in the login_region cookie.
        schema:
          type: string
          default: default
        example: default
      - name: domain
        in: query
        required: false
        description: Value stored in the login_domain cookie.
        schema:
          type: string
        example: ''
      responses:
        '200':
          description: CSRF token issued.
          headers:
            Set-Cookie:
              description: 'platformcsrftoken=<csrf>; login_region=<region>; login_domain="<domain>"'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: csrf_issued
                  csrf_token:
                    type: string
                  region:
                    type: string
                  domain:
                    type: string
                  next:
                    type: string
        '403':
          $ref: '#/components/responses/MissingRequestedWith'
    post:
      tags:
      - Authentication
      summary: Log in and obtain a session cookie
      description: 'Authenticates a username/password pair and returns the platformsessionid
        cookie plus a rotated platformcsrftoken. Requires all three mandatory headers: the
        Cookie header carrying the platformcsrftoken issued by GET /login, an X-CSRFToken
        header holding that same value, and X-Requested-With set to XMLHttpRequest.'
      operationId: post_login
      security: []
      parameters:
      - $ref: '#/components/parameters/CookieHeader'
      - $ref: '#/components/parameters/CsrfTokenHeader'
      - $ref: '#/components/parameters/RequestedWithHeader'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: admin
              password: admin-password
              region: default
              domain: ''
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: admin
              password: admin-password
              region: default
              domain: ''
      responses:
        '200':
          description: Authenticated. The session and CSRF cookies are set on the response.
          headers:
            Set-Cookie:
              description: 'platformsessionid=<session>; platformcsrftoken=<csrf>; login_region=<region>;
                login_domain="<domain>"'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: authenticated
                  username:
                    type: string
                  role:
                    type: string
                    enum:
                    - admin
                    - user
                  region:
                    type: string
                  domain:
                    type: string
                  session_id:
                    type: string
                  csrf_token:
                    type: string
                  required_headers:
                    type: object
                    description: The exact header set to replay on every subsequent call.
                    properties:
                      Cookie:
                        type: string
                      X-CSRFToken:
                        type: string
                      X-Requested-With:
                        type: string
        '400':
          description: username or password missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Username or password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/CsrfFailure'
