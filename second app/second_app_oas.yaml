openapi: 3.0.3

info:
  title: Wind River Studio (dast) — Observed API
  version: "1.0.0-observed"
  description: |
    OpenAPI description of the Wind River Studio `dast` environment, reverse-engineered
    from three browser HAR captures (`dast.wrstudio.cloud.har`, `dast.wrstudio.cloud1.har`,
    `dast.wrstudio.cloud2.har` — 147 requests total, captured 2026-09-08/09).

    **Scope:** 20 path items / 22 operations across three microservices behind a single
    Kong gateway on `dast.wrstudio.cloud`:

    | Service | Prefix | Paths | Ops |
    |---|---|---|---|
    | User Management | `/um/api` | 11 | 12 |
    | Test Automation Framework | `/taf/api` | 8 | 9 |
    | Portal | `/portal/api` | 1 | 1 |

    **Provenance and limits — read before using this for testing:**

    * This is an *observed* contract, not a published one. Every schema here was derived
      from actual traffic. Fields never exercised in the capture are absent; optionality,
      enums and `nullable` flags are inferred from a small number of samples and may be
      wrong.
    * The source HARs were **sanitized on export** — Chrome DevTools' default
      "Export HAR…" strips `Authorization` and `Cookie` — so no credential appears in
      any capture and JWT values show as `[REDACTED_JWT]`. The security schemes below
      were therefore recovered from the application's own auth interceptor and cookie
      service in `main.e705eb3b40d1f153.js`, and corroborated against a known-working
      request. They are accurate; they simply are not visible in the HARs themselves.
    * **No secrets are included in this file.** All token fields carry placeholder
      examples. Resource identifiers (UUIDs, WRRNs, group and role names) are the real
      values from the capture, retained deliberately so requests can be replayed.

    **Deployment — how to call the mock:**

    The `servers` entry below points at a runnable mock of this surface. A second,
    unrelated mock (described by `onpremtest.yaml`) is deployed to the *same* host and
    the *same* base path, so one URL serves both. They do not overlap and they do not
    share anything:

    * **Paths.** This app answers only under `/um/api`, `/portal/api` and `/taf/api`.
      No path in the other spec begins with any of those prefixes, so no request is
      ambiguous and neither spec needs to know about the other.
    * **Credentials.** This app authenticates with `Authorization: Bearer <token>`
      (or the equivalent `authCookiePart*` cookie) and nothing else. The other app
      authenticates with a platform session cookie plus a CSRF header, and nothing
      else. Neither app's credential is recognised by the other — presenting one on
      the other's paths fails, which keeps a test run against this spec isolated from
      a test run against that one.

    Three headers carry every request, and they are the only three needed:

        accept:        application/json, text/plain, */*
        authorization: Bearer <token>
        cookie:        authCookiePart0=<token>; languageCookie=en-US

    Three accounts are seeded — an org admin, a non-owner peer in the same org, and a
    low-privilege account in a different org — so object-level and role-level rules
    can both be exercised. Their tokens are constants that never rotate and never
    expire; they are kept out of this file and published separately.

    **Identity provider** (from `/assets/config/config.json` and `/taf/assets/config.json`):
    Tozny ID (a Keycloak distribution) at `https://tozny.id.dast.wrstudio.cloud`,
    realm `wrai`, client `wr-studio-sso`.

  contact:
    name: Derived from HAR capture
  license:
    name: Internal use

servers:
  - url: https://onprem-01yz.onrender.com
    description: |
      Mock implementation of this surface. It shares a host and a base path with a
      second, unrelated mock (`onpremtest.yaml`), which answers on entirely different
      paths and with entirely different credentials — see **Deployment** above.
  - url: https://dast.wrstudio.cloud
    description: dast environment (Kong gateway) — the host the captures came from.

tags:
  - name: Authentication
    description: Session establishment and token refresh.
  - name: User
    description: Current-user profile, roles, settings and group membership.
  - name: Groups
    description: RBAC group directory.
  - name: Components
    description: Registered platform components and their categories.
  - name: Resources
    description: User-created resources (dashboards etc.) addressed by WRRN.
  - name: Portal
    description: Portal component catalogue.
  - name: TAF Projects
    description: Test Automation Framework projects (v3).
  - name: TAF Test Plans
    description: Test Automation Framework test plans and plugins (v4).
  - name: TAF Executions
    description: Test run executions.

# `Authorization: Bearer <jwt>` is the credential every operation requires.
# Browser traffic additionally carries the chunked `authCookiePart*` cookie holding the
# same JWT, because the SPA is same-origin and the browser attaches it automatically —
# it is listed as an alternative below, but whether the gateway accepts the cookie
# *without* the header has not been tested against a live endpoint.
security:
  - bearerAuth: []
  - authCookie: []

################################################################################
# PATHS
################################################################################
paths:

  # ---------------------------------------------------------------- UM: auth --
  /um/api/auth/users/signIn/verification:
    post:
      tags: [Authentication]
      summary: Exchange a refresh token for a session
      operationId: verifySignIn
      description: |
        RPC-style SSO verification. Accepts an OIDC refresh token and returns the access
        JWT together with the full session bundle (user, roles, settings, entitlements).

        Observed 16 times across the capture — the SPA calls this on load and on a timer
        to keep the access token alive. Note that a non-idempotent `POST` is being used
        for what is effectively a read/refresh.
      security: []   # the refresh token in the body is the credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInVerificationRequest'
      responses:
        '200':
          description: Session established.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UmEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SessionBundle'
        '401':
          $ref: '#/components/responses/UmError'

  /um/api/auth/users/me/profile:
    get:
      tags: [User]
      summary: Get the current user's profile
      operationId: getMyProfile
      responses:
        '200':
          description: Profile of the authenticated user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UmEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
        '304':
          $ref: '#/components/responses/NotModified'

  /um/api/auth/users/me/profile/picture:
    get:
      tags: [User]
      summary: Get the current user's profile picture
      operationId: getMyProfilePicture
      description: |
        Returned `application/json` in every observed call, with `success: false`, because
        the test user has no picture set. The response media type when a picture *does*
        exist was not observed and may differ (e.g. `image/*`).
      responses:
        '200':
          description: Picture metadata, or an error envelope when none is set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UmEnvelope'
              examples:
                noPicture:
                  summary: User has no picture (the only observed outcome)
                  value:
                    success: false
                    data: null
                    message: "error @ getProfilePicture: user does not have a picture"
        '304':
          $ref: '#/components/responses/NotModified'

  /um/api/auth/users/me/roles:
    get:
      tags: [User]
      summary: List the current user's roles
      operationId: getMyRoles
      responses:
        '200':
          description: Roles assigned to the authenticated user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UmEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Role'
        '304':
          $ref: '#/components/responses/NotModified'

  /um/api/auth/users/me/change/setting:
    put:
      tags: [User]
      summary: Update the current user's settings
      operationId: changeMySettings
      description: |
        Applies a batch of setting changes. Each entry references a `settingId` and a
        `settingValueId` from the platform's settings catalogue; the endpoint that lists
        that catalogue was not exercised in the capture.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeSettingsRequest'
      responses:
        '200':
          description: Settings updated; returns the resolved effective settings.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UmEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserSettings'

  /um/api/auth/users/{username}/groups:
    get:
      tags: [User, Groups]
      summary: List a user's group memberships
      operationId: getUserGroups
      parameters:
        - name: username
          in: path
          required: true
          description: Account username.
          schema:
            type: string
          example: testadmin01
      responses:
        '200':
          description: Groups the user belongs to.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UmEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/GroupRef'
              example:
                success: true
                message: Group membership obtained successfully
                data:
                  - id: 5096263a-3edf-4d93-9cad-b36ab2c09414
                    name: hive-admin-group
                  - id: 10c3c4af-5697-4227-83c4-beeca2c235e5
                    name: taf-admin-group
                  - id: 9fed1194-53dc-4059-90fb-034253acec10
                    name: vlab-starter-group

  /um/api/auth/groups:
    get:
      tags: [Groups]
      summary: List all RBAC groups
      operationId: listGroups
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size. `0` was observed and returns all rows.
          schema:
            type: integer
            default: 0
          example: 0
      responses:
        '200':
          description: Paged list of groups.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UmEnvelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/UmPage'
                          - type: object
                            properties:
                              rows:
                                type: array
                                items:
                                  $ref: '#/components/schemas/Group'
        '304':
          $ref: '#/components/responses/NotModified'

  # ---------------------------------------------------------- UM: components --
  /um/api/components:
    get:
      tags: [Components]
      summary: Search registered components
      operationId: listComponents
      parameters:
        - name: name
          in: query
          required: false
          description: Component name filter.
          schema:
            type: string
          example: Portal
      responses:
        '200':
          description: Paged list of components.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UmEnvelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/UmPage'
                          - type: object
                            properties:
                              rows:
                                type: array
                                items:
                                  $ref: '#/components/schemas/Component'
        '304':
          $ref: '#/components/responses/NotModified'

  /um/api/components/categories:
    get:
      tags: [Components]
      summary: List component categories
      operationId: listComponentCategories
      responses:
        '200':
          description: Flat list of category names.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UmEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: string
              example:
                success: true
                message: Components categories obtained successfully
                data: [home, gallery, mcp, ntf, platformhealth, schedule, tozny, um, vault, vlab, taf]
        '304':
          $ref: '#/components/responses/NotModified'

  # ----------------------------------------------------------- UM: resources --
  /um/api/resources:
    get:
      tags: [Resources]
      summary: Search resources
      operationId: listResources
      parameters:
        - name: type
          in: query
          schema: { type: string }
          example: dashboard
        - name: category
          in: query
          schema: { type: string }
          example: dashboard
        - name: username
          in: query
          description: Owner filter. Empty string was observed (no filter).
          schema: { type: string }
          example: ""
        - name: limit
          in: query
          description: Page size. `0` returns all rows.
          schema: { type: integer, default: 0 }
          example: 0
        - name: name
          in: query
          description: Name filter; SQL-style `%` wildcard is accepted.
          schema: { type: string }
          example: "%"
        - name: toolId
          in: query
          description: Filter by originating tool.
          schema: { type: string, format: uuid }
          example: d53ee552-8795-483d-a6e3-f4cae6d3ab98
      responses:
        '200':
          description: Paged list of resources.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UmEnvelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/UmPage'
                          - type: object
                            properties:
                              rows:
                                type: array
                                items:
                                  $ref: '#/components/schemas/Resource'
        '304':
          $ref: '#/components/responses/NotModified'

    post:
      tags: [Resources]
      summary: Register a resource
      operationId: createResource
      description: |
        Creates a resource and returns its WRRN as a bare string in `data`.

        Note two non-REST behaviours observed here: creation returns **200**, not 201
        (the TAF service returns 201 for its creates), and the success payload shape
        differs from `PUT /um/api/resources/{wrrn}`, which returns a full object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceRequest'
      responses:
        '200':
          description: Resource registered. `data` is the new WRRN.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UmEnvelope'
                  - type: object
                    properties:
                      data:
                        type: string
                        description: WRRN of the created resource.
                      error:
                        nullable: true
              example:
                success: true
                message: Resource was registered successfully or already exist
                error: null
                data: "wrrn::aws:49e44597-8990-4f86-9831-9a4e8b0a1730::WRStudionginstaller:useast2:1f62f9b9-e637-4959-9a62-20dce262b8a2::home:7f49c0f6-4475-44b2-a225-9c63b4ab77b0::dashboard:61ccb06b-025d-4c90-aeb7-62561d7ba4d9"
        '400':
          description: |
            Validation failure. Observed twice in the capture when the SPA sent
            `groupId: ""`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UmEnvelope'
              example:
                success: false
                data: null
                correlationId: null
                message: "groupId must be at least 1 characters // groupId must be a valid UUID"

  /um/api/resources/{wrrn}:
    parameters:
      - name: wrrn
        in: path
        required: true
        description: |
          Wind River Resource Name — a `::`-delimited hierarchical identifier of the form
          `wrrn::<cloud>:<accountId>::<namespace>:<region>:<locationId>::<componentType>:<componentId>::<resourceType>:<resourceId>`.
          Must be URL-encoded when placed in a path.
        schema:
          type: string
        example: "wrrn::aws:49e44597-8990-4f86-9831-9a4e8b0a1730::WRStudionginstaller:useast2:1f62f9b9-e637-4959-9a62-20dce262b8a2::home:7f49c0f6-4475-44b2-a225-9c63b4ab77b0::dashboard:61ccb06b-025d-4c90-aeb7-62561d7ba4d9"
    put:
      tags: [Resources]
      summary: Update a resource
      operationId: updateResource
      description: |
        Partial update. Only `description` and `uniqueData` were exercised; other
        mutable fields may exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResourceRequest'
      responses:
        '200':
          description: Updated resource.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UmEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Resource'
                      error:
                        nullable: true

  # -------------------------------------------------------------- PORTAL API --
  /portal/api/component-management/components:
    get:
      tags: [Portal]
      summary: List portal components
      operationId: listPortalComponents
      description: |
        Component catalogue that backs the portal launcher. Icons are returned inline as
        base64 `data:` URIs, which makes responses large.
      responses:
        '200':
          description: Component catalogue.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UmEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PortalComponent'
        '304':
          $ref: '#/components/responses/NotModified'

  # -------------------------------------------------------------- TAF v3 API --
  /taf/api/v3/projects:
    get:
      tags: [TAF Projects]
      summary: List projects
      operationId: listTafProjects
      parameters:
        - $ref: '#/components/parameters/TafOffset'
        - $ref: '#/components/parameters/TafCount'
        - $ref: '#/components/parameters/TafFilter'
        - name: column
          in: query
          description: Sort column.
          schema:
            type: string
            enum: [modifiedDate, name]
            default: modifiedDate
        - $ref: '#/components/parameters/TafDirection'
        - name: getFromTAF
          in: query
          description: Observed always `true`. Purpose not determinable from traffic.
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Paged project list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TafV3Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          totalRows: { type: integer }
                          projects:
                            type: array
                            items:
                              $ref: '#/components/schemas/TafProject'
        '304':
          $ref: '#/components/responses/NotModified'

    post:
      tags: [TAF Projects]
      summary: Create a project
      operationId: createTafProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTafProjectRequest'
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TafV3Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TafProject'

  /taf/api/v3/projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 7b00367e-46fd-4d54-acd7-cc07923d14bb
    get:
      tags: [TAF Projects]
      summary: Get a project
      operationId: getTafProject
      parameters:
        - name: getFromTAF
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Project detail.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TafV3Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TafProject'

  /taf/api/v3/projects/{projectId}/test-plans/{testPlanId}/executions:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 7b00367e-46fd-4d54-acd7-cc07923d14bb
      - name: testPlanId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 0f6ba250-3a07-4858-9aee-1621fcd5392c
    get:
      tags: [TAF Executions]
      summary: List executions for a test plan
      operationId: listTestPlanExecutions
      parameters:
        - $ref: '#/components/parameters/ExecutionStatus'
        - $ref: '#/components/parameters/TafOffset'
        - $ref: '#/components/parameters/TafCount'
        - $ref: '#/components/parameters/TafFilter'
        - name: column
          in: query
          schema: { type: string, default: ranDate }
        - $ref: '#/components/parameters/TafDirection'
      responses:
        '200':
          description: Paged execution list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TafExecutionsResponse'
        '304':
          $ref: '#/components/responses/NotModified'

  /taf/api/v3/executions:
    get:
      tags: [TAF Executions]
      summary: List executions across all projects
      operationId: listTafExecutions
      parameters:
        - $ref: '#/components/parameters/ExecutionStatus'
        - $ref: '#/components/parameters/TafOffset'
        - $ref: '#/components/parameters/TafCount'
        - $ref: '#/components/parameters/TafFilter'
        - name: column
          in: query
          schema: { type: string, default: ranDate }
        - $ref: '#/components/parameters/TafDirection'
      responses:
        '200':
          description: Paged execution list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TafExecutionsResponse'
        '304':
          $ref: '#/components/responses/NotModified'

  # -------------------------------------------------------------- TAF v4 API --
  /taf/api/v4/projects/test-plans:
    get:
      tags: [TAF Test Plans]
      summary: List test plans across all projects
      operationId: listAllTestPlans
      description: |
        Note this route places the literal segment `test-plans` where
        `/taf/api/v4/projects/{projectId}/...` places an id. The traffic alone cannot
        confirm whether the server treats it as a distinct route or as a project id
        named `test-plans`; it is modelled here as a distinct route because it returned
        200 with a list payload.

        Uses `skip`/`limit` paging, unlike the v3 endpoints' `offset`/`count`.
      parameters:
        - name: skip
          in: query
          schema: { type: integer, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - $ref: '#/components/parameters/TafFilter'
        - name: column
          in: query
          schema: { type: string, default: modifiedDate }
        - $ref: '#/components/parameters/TafDirection'
      responses:
        '200':
          description: Paged test-plan list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafTestPlan'
                  totalRows: { type: integer }

  /taf/api/v4/projects/{projectId}/plugins:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 7b00367e-46fd-4d54-acd7-cc07923d14bb
    get:
      tags: [TAF Test Plans]
      summary: List plugins available to a project
      operationId: listProjectPlugins
      description: |
        Observed returning 400 twice because the SPA sent the literal string `null` as
        `projectId` before a project had been selected.
      responses:
        '200':
          description: Plugin list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      description: Shape unknown — only empty arrays were observed.
        '400':
          $ref: '#/components/responses/TafValidationError'

  /taf/api/v4/projects/{projectId}/test-plans:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 7b00367e-46fd-4d54-acd7-cc07923d14bb
    post:
      tags: [TAF Test Plans]
      summary: Create a test plan
      operationId: createTestPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTestPlanRequest'
      responses:
        '201':
          description: |
            Test plan created. Also returns a `Location` header, observed as
            `/v4/projects/{projectId}/test-plans/{testPlanId}` — note it omits the
            `/taf/api` gateway prefix and so is not directly resolvable by the client.
          headers:
            Location:
              description: Path of the created test plan (missing the `/taf/api` prefix).
              schema: { type: string }
              example: /v4/projects/7b00367e-46fd-4d54-acd7-cc07923d14bb/test-plans/0f6ba250-3a07-4858-9aee-1621fcd5392c
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TafTestPlan'
        '400':
