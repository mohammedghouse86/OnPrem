        schema:
          type: string
          format: uuid
        example: 7b00367e-46fd-4d54-acd7-cc07923d14bb
      - name: testPlanId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 0f6ba250-3a07-4858-9aee-1621fcd5392c
    get:
      tags: [TAF Test Plans]
      summary: Get a test plan
      operationId: getTestPlan
      responses:
        '200':
          description: Test plan detail, including its test suites.
          content:
            application/json:
              schema:
