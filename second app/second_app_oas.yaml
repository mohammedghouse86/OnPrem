################################################################################
# COMPONENTS
################################################################################
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Primary credential. The access JWT returned as `data.jwt` from
        `POST /um/api/auth/users/signIn/verification`, issued by Tozny ID (Keycloak)
        realm `wrai`, client `wr-studio-sso`.

        The SPA stores it in `localStorage["token"]` and an Angular `HttpInterceptor`
        attaches it to every outgoing request:

            this.AUTH_HEADER = "Authorization"
            addAuthenticationToken(req) {
              const token = this.localStorage.getItem("token");
              return token
                ? req.clone({ headers: req.headers.set("Authorization", `Bearer ${token}`) })
                : req;
            }

        The interceptor also forces `Content-Type: application/json` on every request
        — GETs included — unless the caller already set it, or the URL contains
        `license/newLicense`. That header is what the app sends, not necessarily what
        the server requires: a working bare `GET` of `/um/api/resources` omits it.

        On `401` the interceptor calls `handleExpiredToken`; on `403` it retries once.

        Against the mock in `servers`, the tokens are static: they are shaped like the
        access tokens the real realm issues, but no signature is verified and the token
        is matched by value. They do not rotate and do not expire, so a client can
        hard-code one. Failures are `401` for a missing, malformed or unknown token and
        `403` for a token whose account may not reach the path or the object; both use
        the `UmEnvelope` error shape.

    authCookie:
      type: apiKey
      in: cookie
      name: authCookiePart0
      description: |
        Secondary transport for the *same* JWT, set client-side so sibling apps on
        `*.dast.wrstudio.cloud` (vlab, grafana, kiali, taf) share one session.

        **The cookie is chunked.** The token is split into 3800-character parts, and
        the part count is stored separately — so `authCookiePart0` alone is only
        sufficient for a JWT of 3800 characters or fewer:

            authCookieCount   -> number of parts, e.g. "2"
            authCookiePart0   -> jwt.slice(0, 3800)
            authCookiePart1   -> jwt.slice(3800, 7600)
            ...
            languageCookie    -> UI locale, e.g. "en-US" (not a credential)
            oidcCookie        -> OIDC handshake state

        Reassembly, from the app's cookie service:

            getAuthCookie() {
              const n = parseInt(this.cookieService.get("authCookieCount"), 10);
              let s = "";
              for (let i = 0; i < n; i++) s += this.cookieService.get(`authCookiePart${i}`) || "";
              return s;
            }

        A JWT carrying many roles and entitlements (this environment issues 13 roles
        and 18 entitlements) can exceed 3800 characters, so check `authCookieCount`
        and send every part rather than assuming one.

        Note: `Cookie` is a forbidden header name in browser `fetch()`. Setting it from
        a browser console is silently ignored — the browser attaches its own same-origin
        cookies instead. Only a non-browser client (Node, curl, Postman) actually sends
        a hand-built `Cookie` header.

  parameters:
    # Path parameters are declared inline on each path item rather than referenced
    # from here: some OpenAPI validators (notably the AMF parser used by the VS Code
    # OpenAPI extension) do not resolve $ref'd path parameters when checking that every
    # path-template variable is declared, and report a false "must be defined in the
    # parameters object" error. Only reusable query parameters live here.

    TafOffset:
      name: offset
      in: query
      schema: { type: integer, default: 0 }

    TafCount:
      name: count
      in: query
      description: Page size. Values 5, 10 and 100 were observed.
      schema: { type: integer, default: 10 }

    TafFilter:
      name: filter
      in: query
      description: Free-text filter. Only the empty string was observed.
      schema: { type: string, default: "" }

    TafDirection:
      name: direction
      in: query
      description: Sort direction — `-1` descending, `1` ascending.
      schema:
        type: integer
        enum: [-1, 1]
        default: -1

    ExecutionStatus:
      name: executionStatus
      in: query
      description: Empty string means no filter.
      schema:
        type: string
        enum: ["", active, completed]
        default: ""

  responses:
    NotModified:
      description: |
        Not Modified. Returned when the client sends `If-None-Match` matching the
        current `ETag`; 54 of the 96 captured API requests were conditional.

    AdminOnly:
      description: |
        Forbidden. The path is reserved to the admin role and the caller holds a
        non-admin one. Applied before the handler runs, so no payload leaks.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UmEnvelope'
          example:
            success: false
            data: null
            correlationId: null
            message: "Role 'user' is not permitted to access /vlab/api/v4/target-manager/bsps."

    UmError:
      description: Error envelope from the User Management service.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UmEnvelope'

    TafValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TafError'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - message: projectId must be a valid UUID
                  field: params.projectId

  schemas:

    VlabStateRef:
      type: object
      description: |
        The row `/states/{stateId}` returns. Note the id is keyed `stateId`, not `id`.
      properties:
        stateId: { type: string, format: uuid, example: 71790855-cdc0-42b1-807d-c742a3cf651b }
        name: { type: string, example: test state }

    VlabTerminalServer:
      type: object
      properties:
        id: { type: string, format: uuid, example: a9f719c7-13d6-4e7e-a407-27c9744a36c7 }
        name: { type: string, example: test }
        username: { type: string, example: usernamw }
        password:
          type: string
          description: |
            Returned as the literal string `[REDACTED]` in the capture. No real
            credential was on the wire, and none is in this file.
          example: "[REDACTED]"
        ipv4Address: { type: string, example: 12.12.12.12 }
        subnetMask: { type: string, example: 255.255.255.0 }
        ipv6Address: { type: string, nullable: true }
        fqdnAddress: { type: string, nullable: true }
        portCount:
          type: string
          description: A string on the way out, even when the create sent a number.
          example: "8080"
        createdDate: { type: string, format: date-time }
        modifiedDate: { type: string, format: date-time, nullable: true }
        createdBy: { type: string, example: testadmin01 }
        modifiedBy: { type: string, nullable: true, example: testadmin01 }

    VlabVirtualTarget:
      type: object
      description: A virtual target template. Each row embeds its whole `vlab_config`.
      properties:
        id: { type: string, format: uuid, example: e343da68-4622-40b0-8078-082a0e342d9f }
        isDeleted: { type: boolean, example: false }
        createdBy: { type: string, example: vt-admin }
        favorite: { type: boolean, example: false }
        isReservable: { type: boolean, example: true }
        template:
          type: object
          properties:
            vlab_config:
              type: object
              description: |
                Free-form map of setting name to descriptor. Each descriptor carries
                `description`, `read_only`, `required` and, variously, `value`,
                `default` and `ui_order`.
              additionalProperties: true

    # ------------------------------------------------------ vlab writes --
    VlabCreateRequest:
      type: object
      description: |
        The create and update body shared by most of the target-manager resources.
        `name` is the only field every one of them requires.
      required: [name]
      properties:
        name: { type: string, example: test_bsp }

    VlabStateRequest:
      allOf:
        - $ref: '#/components/schemas/VlabCreateRequest'
        - type: object
          properties:
            countryId: { type: string, format: uuid, example: f2b5fef5-ef9c-4af5-8513-bff02f0a34fa }

    VlabCityRequest:
      allOf:
        - $ref: '#/components/schemas/VlabCreateRequest'
        - type: object
          properties:
            countryId: { type: string, format: uuid, example: f2b5fef5-ef9c-4af5-8513-bff02f0a34fa }
            stateId: { type: string, format: uuid, example: 71790855-cdc0-42b1-807d-c742a3cf651b }

    VlabLocationRequest:
      allOf:
        - $ref: '#/components/schemas/VlabCreateRequest'
        - type: object
          properties:
            cityId: { type: string, format: uuid, example: 3d509f2d-086c-45b6-bc46-ee9af468ea41 }

    VlabKvmRequest:
      allOf:
        - $ref: '#/components/schemas/VlabCreateRequest'
        - type: object
          properties:
            url: { type: string, nullable: true }
            vncIpAddress: { type: string, example: 12.12.12.12 }
            ldapEnabled: { type: boolean, example: false }
            username: { type: string, example: username }
            password:
              type: string
              format: password
              description: Placeholder only — no real credential belongs in this file.
              example: "[REDACTED]"

    VlabTerminalServerRequest:
      allOf:
        - $ref: '#/components/schemas/VlabCreateRequest'
        - type: object
          properties:
            username: { type: string, example: usernamw }
            password:
              type: string
              format: password
              description: Placeholder only — no real credential belongs in this file.
              example: "[REDACTED]"
            ipv4Address: { type: string, example: 12.12.12.12 }
            subnetMask: { type: string, example: 255.255.255.0 }
            ipv6Address: { type: string, nullable: true }
            fqdnAddress: { type: string, nullable: true }
            portCount:
              description: |
                Sent as a number on create and as a string on update; returned as a
                string either way.
              oneOf:
                - { type: integer, example: 8080 }
                - { type: string, example: "8080" }

    VlabTargetSearchRequest:
      type: object
      properties:
        filters:
          type: object
          description: Only the empty object was observed; the filter keys are unknown.
          additionalProperties: true
        offset: { type: integer, example: 0 }
        count: { type: integer, example: 50 }
        field: { type: string, example: name }
        orderBy: { type: string, enum: [ASC, DESC], example: ASC }
        labConnect: { type: boolean, example: true }

    VlabVirtualTargetSearchRequest:
      type: object
      properties:
        sim_type:
          type: array
          items: { type: string }
          example: [QEMU]
        orderBy:
          type: object
          properties:
            field: { type: string, example: name }
            type: { type: string, enum: [ASC, DESC], example: ASC }

    VlabInsertResult:
      type: object
      description: |
        The insert result the ORM behind the service returns verbatim. It reports the
        same row three times over — `identifiers`, then `generatedMaps` in camelCase,
        then `raw` in snake_case.
      properties:
        identifiers:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
        generatedMaps:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              createdDate: { type: string, format: date-time }
              modifiedDate: { type: string, format: date-time }
        raw:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              created_date: { type: string, format: date-time }
              modified_date: { type: string, format: date-time }

    VlabIdResult:
      type: object
      description: |
        The other create result: just the new id. Which endpoints use this and which
        use `VlabInsertResult` is not predictable from the resource — each is
        documented as observed.
      properties:
        id: { type: string, format: uuid, example: f2b5fef5-ef9c-4af5-8513-bff02f0a34fa }

    VlabUpdateResult:
      type: object
      properties:
        generatedMaps:
          type: array
          items: {}
          description: Empty in every observed update.
        raw:
          type: array
          items: {}
          description: Empty in every observed update.
        affected:
          type: integer
          description: Number of rows changed.
          example: 1

    VlabServiceError:
      type: object
      description: |
        The error body the connection-type create returns. It arrives with an HTTP
        **200** status line while carrying `statusCode: 500` in the payload.
      properties:
        statusCode: { type: integer, example: 500 }
        response:
          type: object
          properties:
            $statusCode: { type: integer, example: 500 }
            status: { type: string, example: error }
            errors:
              type: array
              items:
                type: object
                properties:
                  message: { type: string }
                  detail: { type: string }
                  code: { type: string, example: "45501" }
            errorMessages:
              type: array
              items: { type: string }

    # ------------------------------------------------------------- vlab --
    VlabListEnvelope:
      type: object
      description: |
        Envelope used by the Virtual Lab list endpoints — a fourth shape, distinct from
        `UmEnvelope`, `TafV3Envelope` and TAF v4's bare `{data}`. Note `offset` is a
        **string** while `count` and `total` are integers; that is what the service
        returns.
      properties:
        status: { type: string, example: success }
        count: { type: integer, example: 1 }
        offset: { type: string, example: "0" }
        total: { type: integer, example: 1 }
        data:
          type: array
          items: {}

    VlabDataEnvelope:
      type: object
      description: |
        The unpaged Virtual Lab envelope, used by the hierarchy reads
        (`/cities/{cityId}`, `/labs-locations`, `/locations-city/{locationsCityId}`)
        and by `/checkrbac`.
      properties:
        status: { type: string, example: success }
        data: {}

    VlabRbacCheck:
      type: object
      properties:
        message:
          type: string
          example: You don't have any assigned resource. Please contact your administrator.
        check:
          type: boolean
          description: Whether the caller has any lab resource assigned.
          example: false

    VlabNamedResource:
      type: object
      description: |
        The common shape behind BSPs, architectures, network interfaces, connection
        types, CPUs and PDUs — an id, a name and audit fields, nothing else.
      properties:
        id: { type: string, format: uuid, example: 1364ee63-f7ca-4d79-968f-de999633823a }
        name: { type: string, example: test_bsp }
        createdDate: { type: string, format: date-time, example: "2026-09-10T16:13:24.825Z" }
        modifiedDate: { type: string, format: date-time, nullable: true, example: "2026-09-10T16:13:31.103Z" }
        createdBy: { type: string, example: testadmin01 }
        modifiedBy: { type: string, nullable: true, example: testadmin01 }

    VlabKvm:
      allOf:
        - $ref: '#/components/schemas/VlabNamedResource'
        - type: object
          properties:
            url: { type: string, nullable: true }
            vncIpAddress: { type: string, example: 12.12.12.12 }
            ldapEnabled: { type: boolean, example: false }
            username: { type: string, example: username }
            password:
              type: string
              description: |
                Returned as the literal string `[REDACTED]` in the capture. No real
                credential was ever on the wire, and none is in this file.
              example: "[REDACTED]"

    VlabCountry:
      type: object
      properties:
        id: { type: string, format: uuid, example: f2b5fef5-ef9c-4af5-8513-bff02f0a34fa }
        name: { type: string, example: test country }
        createdDate: { type: string, format: date-time, nullable: true }
        modifiedDate: { type: string, format: date-time, nullable: true }
        createdBy: { type: string, nullable: true }
        modifiedBy: { type: string, nullable: true }
        isDeleted: { type: boolean, example: false }

    VlabState:
      allOf:
        - $ref: '#/components/schemas/VlabCountry'
        - type: object
          properties:
            country:
              $ref: '#/components/schemas/VlabCountry'

    VlabCity:
      allOf:
        - $ref: '#/components/schemas/VlabCountry'
        - type: object
          properties:
            state:
              $ref: '#/components/schemas/VlabState'

    VlabLocationSummary:
      type: object
      description: The trimmed location shape returned by `/locations-city/{id}`.
      properties:
        id: { type: string, format: uuid, example: e3bde3d9-c055-4e01-ac08-f69c7110a682 }
        name: { type: string, example: test site }
        address: { type: string, nullable: true }
        description: { type: string, nullable: true }
        modifiedDate: { type: string, format: date-time, nullable: true }
        modifiedBy: { type: string, nullable: true }

    VlabLocation:
      allOf:
        - $ref: '#/components/schemas/VlabLocationSummary'
        - type: object
          properties:
            createdDate: { type: string, format: date-time, example: "2026-09-10T16:16:12.399Z" }
            createdBy: { type: string, example: testadmin01 }
            city:
              $ref: '#/components/schemas/VlabCity'

    VlabLab:
      type: object
      description: |
        A lab with its whole site hierarchy flattened into `*Name` / `*Id` pairs rather
        than nested objects.
      properties:
        id: { type: string, format: uuid, example: bbedb09e-0bec-4c44-a310-658b21a22120 }
        name: { type: string, example: test lab }
        locationName: { type: string, example: test site }
        locationId: { type: string, format: uuid, example: e3bde3d9-c055-4e01-ac08-f69c7110a682 }
        cityName: { type: string, example: test city }
        cityId: { type: string, format: uuid, example: 3d509f2d-086c-45b6-bc46-ee9af468ea41 }
        stateName: { type: string, example: test state }
        stateId: { type: string, format: uuid, example: 71790855-cdc0-42b1-807d-c742a3cf651b }
        countryName: { type: string, example: test country }
        countryId: { type: string, format: uuid, example: f2b5fef5-ef9c-4af5-8513-bff02f0a34fa }

    VlabLabLocation:
      type: object
      description: |
        Lab paired with its site. The `location_name` and `city_name` keys are
        snake_case here and camelCase everywhere else in the API.
      properties:
        location_name: { type: string, example: test site }
        city_name: { type: string, example: test city }
        id: { type: string, format: uuid, example: bbedb09e-0bec-4c44-a310-658b21a22120 }
        name: { type: string, example: test lab }

    # -------------------------------------------------------------- envelopes --
    UmEnvelope:
      type: object
      description: |
        Response envelope used by the `/um` and `/portal` services. Note the platform
        uses three different envelopes — this one, `TafV3Envelope`, and a bare `{data}`
        object in TAF v4.
      required: [success]
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          nullable: true
          description: Payload; shape varies per operation.
        correlationId:
          type: string
          nullable: true

    TafV3Envelope:
      type: object
      description: Response envelope used by the TAF v3 service.
      properties:
        status:
          type: string
          example: success
        data: {}
        rbacRole:
          type: string
          description: Caller's effective role for the requested scope.
          example: lead
          enum: [lead, unknown]

    UmPage:
      type: object
      description: Pagination wrapper used by `/um` list endpoints.
      properties:
        rows:
          type: array
          items: {}
        limit: { type: integer, example: 5 }
        page: { type: integer, example: 1 }
        totalRows: { type: integer, example: 1 }
        totalPage: { type: integer, example: 1 }

    TafError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Request validation failed
            details:
              type: array
              items:
                type: object
                properties:
                  message: { type: string }
                  field: { type: string }

    # ------------------------------------------------------------------ auth --
    SignInVerificationRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          format: password
          writeOnly: true
          description: |
            OIDC refresh token (JWT) issued by Tozny ID. **Placeholder value only** —
            the real token was redacted from the source capture and must not be
            committed to this file.
          example: "<refresh-token>"

    SessionBundle:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
        expiry:
          type: string
          format: date-time
          description: Access-token expiry.
          example: "2026-09-09T00:13:15.000Z"
        jwt:
          type: string
          format: password
          description: |
            Access token used to authorize subsequent API calls.
            **Placeholder value only** — never store a real token in this file.
          example: "<access-token>"
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        settings:
          $ref: '#/components/schemas/UserSettings'
        permissions:
          type: array
          items: {}
          description: Empty in every observed response; element shape unknown.
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/Entitlement'
        session:
          type: string
          format: uuid
          example: 7d92cb91-895f-44ac-a542-c8cfdcea7880
        userId:
          type: string
          format: uuid
          example: 02da2ad8-644a-480f-b6d2-ac5a8691d3a9
        domain:
          type: string
          example: dast.wrstudio.cloud

    SessionUser:
      type: object
      properties:
        username:   { type: string, example: testadmin01 }
        email:      { type: string, format: email, example: testadmin01@onprem2.com }
        firstName:  { type: string, example: test }
        lastName:   { type: string, example: admin01 }
        fullName:   { type: string, example: test admin01 }
        picture:    { type: string, nullable: true }
        position:   { type: string, nullable: true }
        location:   { type: string, nullable: true }
        department: { type: string, nullable: true }

    # ------------------------------------------------------------------ user --
    UserProfile:
      type: object
      properties:
        userId:                { type: string, format: uuid, example: 02da2ad8-644a-480f-b6d2-ac5a8691d3a9 }
        username:              { type: string, example: testadmin01 }
        email:                 { type: string, format: email, example: testadmin01@onprem2.com }
        phoneNumber:           { type: string, nullable: true, example: "" }
        mobilePhoneNumber:     { type: string, nullable: true }
        firstName:             { type: string, example: test }
        lastName:              { type: string, example: admin01 }
        nickname:              { type: string, nullable: true, example: "" }
        lastLogin:             { type: string, format: date-time, nullable: true, example: "2026-09-08T16:13:15.535Z" }
        lastFailedLogin:       { type: string, format: date-time, nullable: true }
        position:              { type: string, nullable: true }
        department:            { type: string, nullable: true }
        location:              { type: string, nullable: true }
        tenantId:              { type: string, format: uuid, example: cc2bcd01-059e-4eba-95ef-0c57cd98d3f9 }
        toznyId:               { type: string, format: uuid, example: 83a80e68-0cc3-47bc-82ca-b1786d3625cb }
        licenseId:             { type: string, format: uuid, nullable: true, example: 80fd3a5a-98fe-49cf-b28e-0c7a2c36a5fd }
        licenseActionDate:     { type: string, format: date-time, nullable: true, example: "2026-09-01T07:18:16.394Z" }
        licenseLastAssignDate: { type: string, format: date-time, nullable: true, example: "2026-09-01T07:18:16.394Z" }
        groups:
          type: array
          items: { type: string }
          example: [hive-admin-group, license-admin-group, platformhealth-admin-group, taf-admin-group, vault-admin-group]

    Role:
      type: object
      properties:
        roleId: { type: string, format: uuid, example: 3730b12e-375d-4016-b6c1-f61caebe678a }
        name:   { type: string, example: tafAdmin }

    UserSettings:
      type: object
      description: Effective settings, returned as strings even for numeric values.
      properties:
        dateFormat:       { type: string, example: dd/mm/yyyy }
        timeFormat:       { type: string, example: "24" }
        openingApps:      { type: string, example: "1" }
        timeZone:         { type: string, example: GMT+0000 }
        theme:            { type: string, example: dark }
        appCentralOpen:   { type: string, example: "1" }
        appCentralLayout: { type: string, example: "1" }
        language:         { type: string, example: en-US }

    ChangeSettingsRequest:
      type: object
      required: [settings]
      properties:
        settings:
          type: array
          items:
            type: object
            required: [settingId, settingValueId, settingValue]
            properties:
              settingId:      { type: string, format: uuid }
              settingValueId: { type: string, format: uuid }
              settingValue:   { type: string }
      example:
        settings:
          - settingId: 47a219a4-a691-4dab-9af1-6895cfd9545b
            settingValueId: 12bda044-5b9c-4310-857d-7a412fc4165d
            settingValue: GMT+0000
          - settingId: f2d39242-ca24-4c4a-a697-ffc40dc365b8
            settingValueId: 9da91385-133b-41e9-8e0e-ee28bc316ac8
            settingValue: "24"
          - settingId: 1eaf9d0b-9fe1-4bc8-84fe-18f767a812ff
            settingValueId: b1fc5c86-efa9-4c6d-bb4c-92b7deef062c
            settingValue: dd/mm/yyyy
          - settingId: 3f507d4d-ff8f-4926-986c-0d0cfc973654
            settingValueId: 127d990d-819d-43e7-9bb3-9e14c7aedf94
            settingValue: en-US

    # ---------------------------------------------------------------- groups --
    GroupRef:
      type: object
      properties:
        id:   { type: string, format: uuid }
        name: { type: string }

    Group:
      allOf:
        - $ref: '#/components/schemas/GroupRef'
        - type: object
          properties:
            description:
              type: string
              nullable: true
      example:
        id: eb49d895-f5d7-4f89-9f2e-261f748f245d
        name: dfl-lead-group
        description: null

    # ------------------------------------------------------------ components --
    Component:
      type: object
      properties:
        id:           { type: string, format: uuid, example: 7f49c0f6-4475-44b2-a225-9c63b4ab77b0 }
        name:         { type: string, example: Portal }
        wrrn:         { type: string }
        description:  { type: string, nullable: true, example: onprem2 Studio }
        url:          { type: string, example: hosted_zone }
        locationWrrn: { type: string }
        namespace:    { type: string, example: WRStudio-ng-installer }
        geographic:   { type: string, example: us-east-2 }
        environment:  { type: string, example: scales }
        category:     { type: string, example: home }
        type:         { type: string, example: home }
        state:        { type: string, example: ready }
        uniqueData:
          type: object
          additionalProperties: true
          description: Free-form per-component metadata.

    PortalComponent:
      type: object
      properties:
        id:           { type: string, format: uuid, example: 687ceab0-2c7d-45a7-a529-b38f97fb7e03 }
        name:         { type: string, example: Linux Build System }
        url:          { type: string, format: uri, example: https://lxbs.dast.wrstudio.cloud }
        shortname:    { type: string, example: LXBS }
        icon:
          type: string
          description: Inline `data:image/svg+xml;base64,...` URI.
        isThirdParty: { type: boolean }
        isFeature:    { type: boolean }
        isExternal:   { type: boolean }
        isFavorite:   { type: boolean }

    Entitlement:
      type: object
      description: An application the user is entitled to launch.
      properties:
        id:           { type: string, format: uuid, example: 07dbfc5c-0882-4970-9cd9-0d56a49237eb }
        name:         { type: string, example: GitLab }
        url:          { type: string, format: uri, example: https://gitlab.dast.wrstudio.cloud }
        shortName:    { type: string, example: GitLab }
        isThirdParty: { type: boolean, example: true }
        isFeature:    { type: boolean, example: false }

    # ------------------------------------------------------------- resources --
    Resource:
      type: object
      properties:
        wrrn:        { type: string }
        name:        { type: string, example: test_08_sep }
        description: { type: string, nullable: true, example: "" }
        manual:      { type: boolean, example: true }
        type:        { type: string, example: dashboard }
        category:    { type: string, example: dashboard }
        state:       { type: string, example: ready }
        url:         { type: string, format: uri, example: https://dast.wrstudio.cloud/dashboard }
        toolId:      { type: string, format: uuid, example: d53ee552-8795-483d-a6e3-f4cae6d3ab98 }
        rbacRoles:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        team:
          nullable: true
        component:
          $ref: '#/components/schemas/ResourceComponent'
        uniqueData:
          $ref: '#/components/schemas/DashboardUniqueData'

    ResourceComponent:
      type: object
      description: |
        Embedded parent component. Same fields as `Component` minus `id`, plus
        `environmentWrrn`.
      properties:
        wrrn:            { type: string }
        name:            { type: string, example: Portal }
        description:     { type: string, nullable: true }
        url:             { type: string }
        namespace:       { type: string, example: WRStudio-ng-installer }
        geographic:      { type: string, example: us-east-2 }
        locationWrrn:    { type: string }
        environmentWrrn: { type: string, example: "wrrn::aws:49e44597-8990-4f86-9831-9a4e8b0a1730" }
        category:        { type: string, example: home }
        type:            { type: string, example: home }
        state:           { type: string, example: ready }
        uniqueData:
          type: object
          additionalProperties: true

    DashboardUniqueData:
      type: object
      description: |
        Free-form resource payload. For `dashboard` resources it carries widget layout
        and timestamps — note the timestamps are epoch-milliseconds **as strings**,
        unlike the ISO-8601 dates used elsewhere in the platform.
      properties:
        createdDate: { type: string, example: "1788884482306" }
        updatedDate: { type: string, example: "1788884524997" }
        widgets:
          type: array
          items:
            type: object
            description: Shape unknown — only empty arrays were observed.
      additionalProperties: true

    CreateResourceRequest:
      type: object
      required: [name, category, type, componentWrrn, groupId]
      properties:
        name:          { type: string, example: test_08_sep }
        description:   { type: string, example: "" }
        category:      { type: string, example: dashboard }
        type:          { type: string, example: dashboard }
        componentWrrn:
          type: string
          description: WRRN of the parent component.
          example: "wrrn::aws:49e44597-8990-4f86-9831-9a4e8b0a1730::WRStudionginstaller:useast2:1f62f9b9-e637-4959-9a62-20dce262b8a2::home:7f49c0f6-4475-44b2-a225-9c63b4ab77b0"
        state:         { type: string, example: ready }
        toolId:        { type: string, format: uuid, example: d53ee552-8795-483d-a6e3-f4cae6d3ab98 }
        manual:        { type: boolean, example: true }
        groupId:
          type: string
          format: uuid
          description: |
            Owning RBAC group. Required and must be a valid UUID — sending an empty
            string produces the 400 observed in the capture.
          example: eb49d895-f5d7-4f89-9f2e-261f748f245d
        url:           { type: string, format: uri, example: https://dast.wrstudio.cloud/dashboard }
        uniqueData:
          $ref: '#/components/schemas/DashboardUniqueData'

    UpdateResourceRequest:
      type: object
      properties:
        description: { type: string, example: "" }
        uniqueData:
          $ref: '#/components/schemas/DashboardUniqueData'

    # ------------------------------------------------------------------- TAF --
    TafProject:
      type: object
      properties:
        id:                      { type: string, format: uuid, example: 7b00367e-46fd-4d54-acd7-cc07923d14bb }
        projectCode:             { type: string, example: "001" }
        name:                    { type: string, example: test_08_sep }
        description:             { type: string, nullable: true, example: "" }
        targetRetention:         { type: string, example: release }
        targetRetentionDuration: { type: integer, example: 8 }
        isDeleted:               { type: boolean, example: false }
        artifactStorage:         { type: string, nullable: true }
        secretPath:              { type: string, nullable: true }
        ramResourceName:         { type: string, nullable: true }
        modifiedByUserName:      { type: string, example: testadmin01 }
        createdBy:               { type: string, format: email, example: testadmin01@onprem2.com }
        modifiedBy:              { type: string, format: email, example: testadmin01@onprem2.com }
        createdDate:             { type: string, format: date-time, example: "2026-09-08T16:24:43.828Z" }
        modifiedDate:            { type: string, format: date-time, example: "2026-09-08T16:24:43.828Z" }

    CreateTafProjectRequest:
      type: object
      required: [name, projectCode]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: Sent as `null` on create.
        name:                    { type: string, example: test_08_sep }
        projectCode:             { type: string, example: "001" }
        description:             { type: string, nullable: true }
        pipelineId:              { type: string, example: none }
        targetRetention:         { type: string, example: release }
        targetRetentionDuration: { type: integer, example: 8 }
        rbacGroup:
          type: string
          description: Name (not id) of the owning RBAC group.
          example: plm-task-library-viewer-group

    TafTestPlan:
